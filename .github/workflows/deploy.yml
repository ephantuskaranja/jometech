# On every push to master: run the tests against MySQL 8.0 (what the server runs),
# and only if they pass, deploy to the server with scripts/deploy.sh.
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         server IP or name
#   DEPLOY_USER         jometech
#   DEPLOY_SSH_KEY      private key whose public half is in the server's ~jometech/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <server>
# Setup steps: docs/DEPLOY.md
name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jometech
          MYSQL_USER: app_user
          MYSQL_PASSWORD: ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: jometech
      DB_USERNAME: app_user
      DB_PASSWORD: ci-password
      SESSION_SECRET: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" /var/www/apps/jometech/scripts/deploy.sh
