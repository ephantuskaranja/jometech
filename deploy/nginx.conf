# nginx: for a server that already uses nginx for other sites (instead of Caddy).
# nginx only forwards requests to the Node app; there is no PHP and no document root.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jometech.switchreality.co.ke
#   sudo ln -s /etc/nginx/sites-available/jometech.switchreality.co.ke /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jometech.switchreality.co.ke     (adds HTTPS and the redirect)
#
# Then turn on HTTP/2 (the browser fetches a page's CSS, JS and fonts all at once). certbot writes
# the HTTPS block into this file on the server, as a "listen 443 ssl;" line. Below that line add:
#       http2 on;
# (nginx older than 1.25.1, see `nginx -v`: change the line to "listen 443 ssl http2;" instead.)
#   sudo nginx -t && sudo systemctl reload nginx
#   check:  curl -sI --http2 https://jometech.switchreality.co.ke/login | head -1   → HTTP/2 200
#
# Compression is done by the app itself (gzip, src/app.js); nginx passes it through as it is.
server {
    listen 80;
    server_name jometech.switchreality.co.ke;

    client_max_body_size 20M;   # check-in photos

    location / {
        proxy_pass http://127.0.0.1:3035;   # PORT in .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # the app's login cookie is https-only
    }
}
