# nginx: for a server that already uses nginx for other sites (instead of Caddy).
# nginx only forwards requests to the Node app; there is no PHP and no document root.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jometech.switchreality.co.ke
#   sudo ln -s /etc/nginx/sites-available/jometech.switchreality.co.ke /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jometech.switchreality.co.ke     (adds HTTPS and the redirect)
server {
    listen 80;
    server_name jometech.switchreality.co.ke;

    client_max_body_size 20M;   # check-in photos

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # the app's login cookie is https-only
    }
}
